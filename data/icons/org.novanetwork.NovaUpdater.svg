  <circle cx="64" cy="64" r="9" fill="#1a5fb4"/>
  <circle cx="64" cy="64" r="9" fill="none" stroke="#ffffff" stroke-width="3"/>
  <!-- sparks -->
  <circle cx="95" cy="30" r="5" fill="#ffffff" opacity="0.9"/>
  <circle cx="31" cy="95" r="4" fill="#ffffff" opacity="0.65"/>
  <circle cx="99" cy="93" r="3" fill="#ffffff" opacity="0.5"/>
