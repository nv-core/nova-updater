<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#1a5fb4"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#deddda"/>
    </linearGradient>
  </defs>
  <!-- GNOME-style rounded square -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)"/>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="none" stroke="#000000" stroke-opacity="0.12" stroke-width="2"/>
  <!-- nova burst -->
  <path d="M64 20 L71.5 51 A16 16 0 0 1 77 56.5 L108 64 L77 71.5 A16 16 0 0 1 71.5 77 L64 108 L56.5 77 A16 16 0 0 1 51 71.5 L20 64 L51 56.5 A16 16 0 0 1 56.5 51 Z" fill="url(#star)"/>
